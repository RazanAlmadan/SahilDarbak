spring.application.name=SahlDarbak



spring.datasource.url=jdbc:mysql://localhost:3306/SahlDarbak
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always


gemini.api.key=${GEMINI_API_KEY}
openweather.api.key=${OPENWEATHER_API_KEY}
openweather.api.url=https://api.openweathermap.org/data/2.5/weather


geoapify.api.key=${GEOAPIFY_API_KEY}
tavily.api.key=${TAVILY_API_KEY}
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=sahildarbak.app@gmail.com
brevo.sender.name=Sahil Darbk

whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
