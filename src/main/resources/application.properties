spring.application.name=SahlDarbak



spring.datasource.url=jdbc:mysql://localhost:4306/SahlDarbak
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always


gemini.api.key=${GEMINI_API_KEY}
openweather.api.key=${OPENWEATHER_API_KEY}
openweather.api.url=https://api.openweathermap.org/data/2.5/weather


spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_LOGIN}
spring.mail.password=${BREVO_SMTP_KEY}
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=leema442@gmail.com
brevo.sender.name=SahlDarbak

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true




whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}


geoapify.api.key=${GEOAPIFY_API_KEY}
tavily.api.key=${TAVILY_API_KEY}