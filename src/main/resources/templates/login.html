<!DOCTYPE html>
<html lang="ar"
      dir="rtl"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | SahlDarbak</title>

    <link rel="stylesheet"
          th:href="@{/css/base.css}"
          href="/css/base.css">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}"
          href="/css/auth.css">

</head>

<body class="auth-page login-page">

<div th:replace="~{fragments/navbar.html :: navbar}"></div>

<main class="auth-main">

    <section class="auth-card">

        <div class="auth-header">

            <span class="auth-icon">
                <span class="material-symbols-rounded">
                    flight_takeoff
                </span>
            </span>

            <h1 data-i18n="loginTitle">
                رجعت لنا؟ 👋
            </h1>

            <p data-i18n="loginDescription">
                سجل دخولك وكمل تخطيط رحلتك من وين وقفت.
            </p>

        </div>


        <form id="loginForm"
              class="auth-form">

            <div class="form-group">

                <label for="email"
                       data-i18n="email">
                    البريد الإلكتروني
                </label>

                <div class="input-wrapper">

                    <span class="material-symbols-rounded">
                        mail
                    </span>

                    <input type="email"
                           id="email"
                           required>

                </div>

            </div>


            <div class="form-group">

                <label for="password"
                       data-i18n="password">
                    كلمة المرور
                </label>

                <div class="input-wrapper">

                    <span class="material-symbols-rounded">
                        lock
                    </span>

                    <input type="password"
                           id="password"
                           required>

                </div>

            </div>


            <p id="loginError"
               class="form-message error-message"></p>


            <button type="submit"
                    id="loginButton"
                    class="btn btn-primary auth-submit">

                <span data-i18n="login">
                    تسجيل الدخول
                </span>

            </button>

        </form>


        <p class="auth-switch">

            <span data-i18n="noAccount">
                أول مرة معنا؟
            </span>

            <a th:href="@{/register}"
               href="/register"
               data-i18n="createAccount">
                أنشئ حساب
            </a>

        </p>

    </section>

</main>

<div th:replace="~{fragments/footer.html :: footer}"></div>

<script th:src="@{/js/language.js}"
        src="/js/language.js"></script>

<script th:src="@{/js/base.js}"
        src="/js/base.js"></script>

<script th:src="@{/js/login.js}"
        src="/js/login.js"></script>

</body>
</html>
