<!DOCTYPE html>
<html lang="ar"
      dir="rtl"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | SahlDarbak</title>

    <link rel="stylesheet"
          th:href="@{/css/base.css}"
          href="/css/base.css">

    <link rel="stylesheet"
          th:href="@{/css/auth.css}"
          href="/css/auth.css">

</head>

<body class="auth-page register-page">

<div th:replace="~{fragments/navbar.html :: navbar}"></div>

<main class="auth-main">

    <section class="auth-card">

        <div class="auth-header">

            <span class="auth-icon">
                <span class="material-symbols-rounded">
                    travel_explore
                </span>
            </span>

            <h1 data-i18n="registerTitle">
                يلا نبدأ رحلتك ✈️
            </h1>

            <p data-i18n="registerDescription">
                أنشئ حسابك وخلك جاهز تخطط رحلتك على جوّك.
            </p>

        </div>


        <form id="registerForm"
              class="auth-form">

            <div class="form-group">

                <label for="email"
                       data-i18n="email">
                    البريد الإلكتروني
                </label>

                <div class="input-wrapper">

                    <span class="material-symbols-rounded">
                        mail
                    </span>

                    <input type="email"
                           id="email"
                           required>

                </div>

            </div>


            <div class="form-group">

                <label for="phoneNumber"
                       data-i18n="phone">
                    رقم الجوال
                </label>

                <div class="input-wrapper">

                    <span class="material-symbols-rounded">
                        call
                    </span>

                    <input type="tel"
                           id="phoneNumber"
                           placeholder="+9665XXXXXXXX"
                           required>

                </div>

            </div>


            <div class="form-group">

                <label for="password"
                       data-i18n="password">
                    كلمة المرور
                </label>

                <div class="input-wrapper">

                    <span class="material-symbols-rounded">
                        lock
                    </span>

                    <input type="password"
                           id="password"
                           minlength="8"
                           required>

                </div>

                <small data-i18n="passwordHint">
                    8 أحرف على الأقل
                </small>

            </div>


            <p id="registerError"
               class="form-message error-message"></p>


            <button type="submit"
                    id="registerButton"
                    class="btn btn-primary auth-submit">

                <span data-i18n="createAccount">
                    إنشاء حساب
                </span>

            </button>

        </form>


        <p class="auth-switch">

            <span data-i18n="alreadyAccount">
                عندك حساب؟
            </span>

            <a th:href="@{/login}"
               href="/login"
               data-i18n="login">
                تسجيل الدخول
            </a>

        </p>

    </section>

</main>

<div th:replace="~{fragments/footer.html :: footer}"></div>

<script th:src="@{/js/language.js}"
        src="/js/language.js"></script>

<script th:src="@{/js/base.js}"
        src="/js/base.js"></script>

<script th:src="@{/js/register.js}"
        src="/js/register.js"></script>

</body>
</html>
